# AMD Lemonade NPU profile — opt-in through `meeting-notes configure`.
# Start Lemonade Server manually before provisioning or processing.

runtime:
  device: npu
  asr_backend: lemonade
  allow_fallback: false

asr:
  model: large-v3-turbo
  model_path: null
  backend_options:
    lemonade:
      base_url: http://127.0.0.1:13305
      model_id: Whisper-Large-v3-Turbo
      api_key_env: LEMONADE_API_KEY
      connect_timeout_seconds: 5
      provisioning_timeout_seconds: 3600
      transcription_timeout_seconds: 7200
      max_upload_mib: 40

# Optional local summarization. The setup wizard can select this independently
# from ASR and will never start Lemonade Server itself.
summarization:
  lemonade:
    base_url: http://127.0.0.1:13305
    model_id: Gemma-4-26B-A4B-it-MTP-GGUF
    prompt_path: ./prompts/meeting-summary-local.md
    request_timeout_seconds: 7200
    max_completion_tokens: null
