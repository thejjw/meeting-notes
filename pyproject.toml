[project]
name = "meeting-notes"
version = "0.1.0"
description = "Local-first Korean/English meeting transcription and notes"
requires-python = "==3.12.*"
license = "Zlib"
readme = "README.md"
authors = [
    { name = "Jaewoo Jeon", email = "72130076+thejjw@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
    "psutil>=5.9.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright[nodejs]>=1.1.370",
]
whisper-openai = [
    "openai-whisper>=20231117",
]
faster-whisper = [
    "faster-whisper>=1.0.0",
]
diarization = [
    "pyannote.audio>=3.1.0",
]
all = [
    "meeting-notes[whisper-openai,faster-whisper,diarization]",
]

[project.scripts]
meeting-notes = "meeting_notes.cli:app"

[build-system]
requires = ["uv_build>=0.1.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright[nodejs]>=1.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external tools or models (deselect with '-m \"not integration\"')",
    "slow: marks tests that take a long time",
]
